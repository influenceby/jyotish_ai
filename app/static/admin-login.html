<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jyotish AI - Admin Login</title>

    <link rel="stylesheet" href="/static/admin-login.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>🔐 Admin Login</h1>

        <p class="subtitle">
            Jyotish AI Administration Panel
        </p>

        <form id="adminLoginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Login to Dashboard
            </button>

        </form>

        <p id="errorMessage" class="error-message"></p>

    </div>

</div>

<script src="/static/admin-login.js"></script>

</body>
</html>
